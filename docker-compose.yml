# Pulse 2.0 local platform.
# Images are pinned to exact versions: ":latest" makes builds unreproducible (a v1 lesson).
# Start:  docker compose up -d --wait     (or: make up)

name: pulse

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.7
    container_name: pulse-redpanda
    command:
      - redpanda start
      - --mode dev-container          # single node, relaxed fsync: dev only, never production
      - --smp 1
      - --memory 1G
      # Two listeners: containers reach "redpanda:9092", your laptop reaches "localhost:19092".
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      # A typo'd topic name must ERROR, not silently create a 1-partition topic.
      - --set redpanda.auto_create_topics_enabled=false
    ports:
      - "19092:19092"   # Kafka API (host)
      - "19644:9644"    # Admin API / metrics
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  console:
    image: redpandadata/console:v3.14.0
    container_name: pulse-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"     # Web UI: browse topics, partitions, consumer groups, offsets
    depends_on:
      redpanda:
        condition: service_healthy

  objectstore:
    # S3-compatible object storage. MinIO stopped publishing public images in 2025,
    # so we use RustFS (Apache-2.0, MinIO-compatible). Code only speaks the S3 API.
    image: rustfs/rustfs:1.0.6
    container_name: pulse-objectstore
    environment:
      RUSTFS_ACCESS_KEY: ${PULSE_S3_ACCESS_KEY:-pulseadmin}
      RUSTFS_SECRET_KEY: ${PULSE_S3_SECRET_KEY:-pulseadmin-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Web console
    volumes:
      - objectstore_data:/data

volumes:
  redpanda_data:
  objectstore_data:
