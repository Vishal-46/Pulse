[project]
name = "pulse"
version = "2.0.0"
description = "Market data engineering platform: Kafka streaming, Spark medallion lakehouse, DuckDB analytics"
requires-python = ">=3.11,<3.13"
dependencies = [
    "confluent-kafka>=2.16.2",
    "duckdb>=2.0.0",
    "pandas<3",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyspark>=4.3.0",
    "tenacity>=9.2.1",
    "yfinance>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker-compose stack running"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
